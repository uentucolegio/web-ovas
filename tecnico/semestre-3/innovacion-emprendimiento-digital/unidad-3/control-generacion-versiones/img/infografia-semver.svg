<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Poppins, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#f0fdf4"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="80" cy="820" r="220" fill="#dcfce7" opacity=".55"/>
  <text x="100" y="110" font-size="24" font-weight="700" fill="#16a34a" letter-spacing="3">VERSIONADO SEMÁNTICO 2.0.0</text>
  <text x="100" y="170" font-size="54" font-weight="700" fill="#166534">Anatomía de un número de versión</text>
  <!-- número -->
  <g filter="url(#sh)" font-family="'Courier New', Courier, monospace" font-weight="700" text-anchor="middle">
    <rect x="290" y="225" width="170" height="150" rx="22" fill="#166534"/>
    <text x="375" y="335" font-size="110" fill="#fff">2</text>
    <rect x="530" y="225" width="170" height="150" rx="22" fill="#16a34a"/>
    <text x="615" y="335" font-size="110" fill="#fff">3</text>
    <rect x="770" y="225" width="170" height="150" rx="22" fill="#22c55e"/>
    <text x="855" y="335" font-size="110" fill="#064e3b">1</text>
    <rect x="1010" y="225" width="300" height="150" rx="22" fill="#fef9c3" stroke="#eab308" stroke-width="4"/>
    <text x="1160" y="325" font-size="64" fill="#a16207">-beta.1</text>
  </g>
  <g font-family="'Courier New', Courier, monospace" font-size="110" font-weight="700" fill="#16a34a" text-anchor="middle">
    <text x="495" y="360">.</text><text x="735" y="360">.</text>
  </g>
  <!-- conectores -->
  <g stroke="#86efac" stroke-width="4" stroke-dasharray="10 8" fill="none">
    <path d="M375 375 L375 420 L230 420 L230 470"/>
    <path d="M615 375 L615 470"/>
    <path d="M855 375 L855 420 L990 420 L990 470"/>
    <path d="M1160 375 L1160 420 L1370 420 L1370 470"/>
  </g>
  <!-- tarjetas -->
  <g filter="url(#sh)">
    <rect x="100" y="470" width="320" height="230" rx="18" fill="#fff" stroke="#166534" stroke-width="3"/>
    <rect x="455" y="470" width="320" height="230" rx="18" fill="#fff" stroke="#16a34a" stroke-width="3"/>
    <rect x="810" y="470" width="320" height="230" rx="18" fill="#fff" stroke="#22c55e" stroke-width="3"/>
    <rect x="1165" y="470" width="335" height="230" rx="18" fill="#fff" stroke="#eab308" stroke-width="3"/>
  </g>
  <g font-size="22" fill="#334155">
    <text x="128" y="516" font-size="28" font-weight="700" fill="#166534">MAJOR</text>
    <text x="128" y="556">Cambios incompatibles:</text><text x="128" y="586">lo que funcionaba</text><text x="128" y="616">puede dejar de</text><text x="128" y="646">funcionar.</text>
    <text x="483" y="516" font-size="28" font-weight="700" fill="#16a34a">MINOR</text>
    <text x="483" y="556">Funciones nuevas</text><text x="483" y="586">compatibles con la</text><text x="483" y="616">versión anterior.</text>
    <text x="838" y="516" font-size="28" font-weight="700" fill="#15803d">PATCH</text>
    <text x="838" y="556">Correcciones de</text><text x="838" y="586">errores que no</text><text x="838" y="616">cambian funciones.</text>
    <text x="1193" y="516" font-size="28" font-weight="700" fill="#a16207">PRE-RELEASE</text>
    <text x="1193" y="556">Versión preliminar</text><text x="1193" y="586">(alpha, beta, rc):</text><text x="1193" y="616">aún puede cambiar.</text>
  </g>
  <!-- ejemplos -->
  <rect x="100" y="740" width="1400" height="110" rx="18" fill="#102033"/>
  <g font-size="26" fill="#fff">
    <text x="140" y="785" font-weight="700" fill="#86efac">Desde 1.4.2:</text>
    <text x="140" y="827" font-family="'Courier New', Courier, monospace" font-weight="700">fix → 1.4.3</text>
    <text x="520" y="827" font-family="'Courier New', Courier, monospace" font-weight="700">feat → 1.5.0</text>
    <text x="920" y="827" font-family="'Courier New', Courier, monospace" font-weight="700">cambio incompatible → 2.0.0</text>
  </g>
</svg>
