<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Poppins, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#f0fdf4"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1480" cy="120" r="210" fill="#dcfce7" opacity=".6"/>
  <text x="100" y="118" font-size="24" font-weight="700" fill="#16a34a" letter-spacing="3">PITCH ELEVATOR DE VALIDACIÓN</text>
  <text x="100" y="180" font-size="54" font-weight="700" fill="#166534">Anatomía de un pitch de 120 segundos</text>
  <text x="100" y="228" font-size="26" fill="#475569">Cada bloque responde una pregunta. La evidencia ocupa el centro de la historia.</text>
  <!-- cronómetro -->
  <g transform="translate(1390 150)">
    <rect x="-14" y="-118" width="28" height="26" rx="6" fill="#166534"/>
    <circle r="88" fill="#fff" stroke="#166534" stroke-width="12" filter="url(#sh)"/>
    <path d="M0 0 L0 -70 A70 70 0 0 1 70 0 Z" fill="#22c55e"/>
    <circle r="8" fill="#166534"/>
    <line x1="0" y1="0" x2="0" y2="-62" stroke="#166534" stroke-width="6" stroke-linecap="round"/>
    <text y="128" font-size="24" font-weight="700" fill="#166534" text-anchor="middle">90–120 s</text>
  </g>
  <!-- línea de tiempo -->
  <g filter="url(#sh)">
    <rect x="100" y="320" width="233" height="96" rx="18" fill="#166534"/>
    <rect x="337" y="320" width="288" height="96" rx="18" fill="#15803d"/>
    <rect x="629" y="320" width="288" height="96" rx="18" fill="#16a34a"/>
    <rect x="921" y="320" width="346" height="96" rx="18" fill="#22c55e"/>
    <rect x="1271" y="320" width="229" height="96" rx="18" fill="#bbf7d0"/>
  </g>
  <g font-size="30" font-weight="700" text-anchor="middle">
    <text x="216" y="378" fill="#fff">Apertura</text>
    <text x="481" y="378" fill="#fff">Problema</text>
    <text x="773" y="378" fill="#fff">MVP</text>
    <text x="1094" y="378" fill="#064e3b">Evidencia</text>
    <text x="1385" y="378" fill="#166534">Petición</text>
  </g>
  <g font-size="22" font-weight="600" fill="#64748b" text-anchor="middle">
    <text x="100" y="452">0 s</text><text x="335" y="452">20 s</text><text x="627" y="452">45 s</text><text x="919" y="452">70 s</text><text x="1269" y="452">100 s</text><text x="1500" y="452">120 s</text>
  </g>
  <!-- tarjetas -->
  <g filter="url(#sh)">
    <rect x="100" y="490" width="262" height="230" rx="18" fill="#fff" stroke="#bbf7d0" stroke-width="2"/>
    <rect x="384" y="490" width="262" height="230" rx="18" fill="#fff" stroke="#bbf7d0" stroke-width="2"/>
    <rect x="668" y="490" width="262" height="230" rx="18" fill="#fff" stroke="#bbf7d0" stroke-width="2"/>
    <rect x="952" y="490" width="262" height="230" rx="18" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
    <rect x="1236" y="490" width="262" height="230" rx="18" fill="#fff" stroke="#bbf7d0" stroke-width="2"/>
  </g>
  <g font-size="22" fill="#334155">
    <text x="124" y="536" font-weight="700" fill="#166534" font-size="24">Engancha</text>
    <text x="124" y="576">¿Qué situación</text><text x="124" y="606">llama la atención</text><text x="124" y="636">y por qué importa</text><text x="124" y="666">ahora?</text>
    <text x="408" y="536" font-weight="700" fill="#166534" font-size="24">Problema y usuario</text>
    <text x="408" y="576">¿Quién lo vive y</text><text x="408" y="606">qué dato prueba</text><text x="408" y="636">que es real?</text>
    <text x="692" y="536" font-weight="700" fill="#166534" font-size="24">Solución mínima</text>
    <text x="692" y="576">¿Qué se construyó</text><text x="692" y="606">y qué parte del</text><text x="692" y="636">valor demuestra?</text>
    <text x="976" y="536" font-weight="700" fill="#166534" font-size="24">Datos y decisión</text>
    <text x="976" y="576">¿Qué se probó,</text><text x="976" y="606">qué se aprendió</text><text x="976" y="636">y qué se decidió?</text><text x="976" y="676" font-weight="700" fill="#15803d">Centro del pitch</text>
    <text x="1260" y="536" font-weight="700" fill="#166534" font-size="24">Siguiente paso</text>
    <text x="1260" y="576">¿Qué viene y qué</text><text x="1260" y="606">necesitas de la</text><text x="1260" y="636">audiencia?</text>
  </g>
  <!-- regla -->
  <rect x="100" y="770" width="1400" height="80" rx="18" fill="#102033"/>
  <text x="140" y="822" font-size="28" font-weight="700" fill="#86efac">Regla de oro:</text>
  <text x="345" y="822" font-size="28" fill="#ffffff">un dato honesto convence más que diez adjetivos.</text>
</svg>
