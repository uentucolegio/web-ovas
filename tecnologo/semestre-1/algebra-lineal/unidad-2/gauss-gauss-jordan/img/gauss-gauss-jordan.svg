<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Metodo de Gauss y Gauss Jordan</title>
  <desc id="desc">Ilustracion con matrices aumentadas, pivotes y una ruta de eliminacion por filas.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="800" height="420" rx="32" fill="url(#bg)" />
  <circle cx="124" cy="90" r="72" fill="#bbf7d0" opacity="0.38" />
  <circle cx="700" cy="326" r="88" fill="#dcfce7" opacity="0.5" />

  <g filter="url(#shadow)">
    <rect x="40" y="60" width="332" height="300" rx="28" fill="url(#panel)" />
    <rect x="40" y="60" width="332" height="16" rx="8" fill="url(#accent)" />
    <text x="64" y="102" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">
      Eliminacion
    </text>

    <g transform="translate(72 138)">
      <rect x="0" y="0" width="266" height="164" rx="24" fill="#ffffff" />
      <text x="18" y="30" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="700" fill="#166534">
        [1 1 | 10]
      </text>
      <text x="18" y="62" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="700" fill="#166534">
        [1 -1 | 2]
      </text>
      <line x1="16" y1="84" x2="250" y2="84" stroke="#bbf7d0" stroke-width="2.5" />
      <text x="18" y="112" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="700" fill="#15803d">
        F₂ - F₁ → F₂
      </text>
      <text x="18" y="142" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="700" fill="#166534">
        [1 1 | 10]
      </text>
      <text x="18" y="172" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="700" fill="#166534">
        [0 -2 | -8]
      </text>
      <circle cx="60" cy="142" r="8" fill="#16a34a" opacity="0.22" />
      <circle cx="96" cy="172" r="8" fill="#16a34a" opacity="0.28" />
    </g>
  </g>

  <g>
    <path d="M388 208 C426 208, 436 208, 470 208" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round" />
    <path d="M454 190 L490 208 L454 226" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <g filter="url(#shadow)">
    <rect x="494" y="60" width="266" height="300" rx="28" fill="url(#panel)" />
    <rect x="494" y="60" width="266" height="16" rx="8" fill="url(#accent)" />
    <text x="520" y="102" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">
      Gauss Jordan
    </text>

    <g transform="translate(520 138)">
      <rect x="0" y="0" width="212" height="164" rx="24" fill="#ffffff" />
      <text x="16" y="28" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="700" fill="#166534">
        Pivotes y columnas limpias
      </text>
      <text x="18" y="64" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="700" fill="#166534">
        [1 0 | 6]
      </text>
      <text x="18" y="96" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="700" fill="#166534">
        [0 1 | 4]
      </text>
      <line x1="16" y1="116" x2="194" y2="116" stroke="#bbf7d0" stroke-width="2.5" />
      <text x="18" y="144" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="700" fill="#15803d">
        Lectura directa: x = 6, y = 4
      </text>
      <circle cx="40" cy="64" r="8" fill="#16a34a" opacity="0.28" />
      <circle cx="76" cy="96" r="8" fill="#16a34a" opacity="0.28" />
      <rect x="146" y="44" width="42" height="64" rx="14" fill="#f0fdf4" stroke="#bbf7d0" />
      <text x="167" y="70" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="700" fill="#166534">
        REF
      </text>
      <text x="167" y="92" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="700" fill="#166534">
        →
      </text>
      <text x="167" y="112" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="700" fill="#166534">
        RREF
      </text>
    </g>
  </g>

  <g transform="translate(154 18)">
    <rect width="492" height="40" rx="18" fill="#ffffff" opacity="0.94" />
    <text x="246" y="25" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="700" fill="#166534">
      Metodo del caso: matriz aumentada, pivotes, eliminacion y lectura final
    </text>
  </g>
</svg>
