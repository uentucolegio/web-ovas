<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Matrices inversas y determinantes</title>
  <desc id="desc">Ilustracion con una matriz, su determinante y la idea de la inversa para recuperar variables.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="800" height="420" rx="32" fill="url(#bg)" />
  <circle cx="126" cy="92" r="72" fill="#bbf7d0" opacity="0.38" />
  <circle cx="700" cy="326" r="88" fill="#dcfce7" opacity="0.5" />

  <g filter="url(#shadow)">
    <rect x="40" y="60" width="332" height="300" rx="28" fill="url(#panel)" />
    <rect x="40" y="60" width="332" height="16" rx="8" fill="url(#accent)" />
    <text x="64" y="102" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">
      Determinante
    </text>

    <g transform="translate(74 138)">
      <rect x="0" y="0" width="264" height="164" rx="24" fill="#ffffff" />
      <text x="18" y="34" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="700" fill="#166534">
        A = [2  1]
      </text>
      <text x="64" y="62" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="700" fill="#166534">
        [1  1]
      </text>
      <line x1="16" y1="82" x2="248" y2="82" stroke="#bbf7d0" stroke-width="2.5" />
      <text x="18" y="112" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="700" fill="#15803d">
        det(A) = (2 * 1) - (1 * 1)
      </text>
      <text x="18" y="142" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="700" fill="#166534">
        det(A) = 1
      </text>
      <text x="18" y="170" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="700" fill="#15803d">
        A es invertible
      </text>
      <circle cx="52" cy="34" r="8" fill="#16a34a" opacity="0.24" />
      <circle cx="124" cy="142" r="8" fill="#16a34a" opacity="0.28" />
    </g>
  </g>

  <g>
    <path d="M388 208 C426 208, 436 208, 470 208" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round" />
    <path d="M454 190 L490 208 L454 226" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <g filter="url(#shadow)">
    <rect x="494" y="60" width="266" height="300" rx="28" fill="url(#panel)" />
    <rect x="494" y="60" width="266" height="16" rx="8" fill="url(#accent)" />
    <text x="520" y="102" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">
      Inversa
    </text>

    <g transform="translate(520 138)">
      <rect x="0" y="0" width="212" height="164" rx="24" fill="#ffffff" />
      <text x="18" y="30" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="700" fill="#166534">
        A⁻¹ = [ 1  -1 ]
      </text>
      <text x="74" y="58" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="700" fill="#166534">
        [ -1   2 ]
      </text>
      <line x1="16" y1="80" x2="194" y2="80" stroke="#bbf7d0" stroke-width="2.5" />
      <text x="18" y="108" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="700" fill="#15803d">
        X = A⁻¹B
      </text>
      <text x="18" y="138" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="700" fill="#166534">
        X = [5]
      </text>
      <text x="46" y="166" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="700" fill="#166534">
        [1]
      </text>
      <circle cx="38" cy="138" r="8" fill="#16a34a" opacity="0.24" />
      <circle cx="146" cy="30" r="8" fill="#16a34a" opacity="0.24" />
    </g>
  </g>

  <g transform="translate(140 18)">
    <rect width="520" height="40" rx="18" fill="#ffffff" opacity="0.94" />
    <text x="260" y="25" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="700" fill="#166534">
      Metodo del caso: construir A, calcular det(A), decidir invertibilidad y aplicar A⁻¹
    </text>
  </g>
</svg>
