<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Sistemas de ecuaciones lineales</title>
  <desc id="desc">Ilustracion con rectas que se intersectan, rectas paralelas y una ruta de resolucion por estudio de casos.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="800" height="420" rx="32" fill="url(#bg)" />
  <circle cx="120" cy="96" r="70" fill="#bbf7d0" opacity="0.38" />
  <circle cx="700" cy="324" r="88" fill="#dcfce7" opacity="0.5" />

  <g filter="url(#shadow)">
    <rect x="40" y="60" width="330" height="300" rx="28" fill="url(#panel)" />
    <rect x="40" y="60" width="330" height="16" rx="8" fill="url(#accent)" />
    <text x="64" y="102" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">
      Interseccion
    </text>

    <g transform="translate(72 132)">
      <rect x="0" y="0" width="266" height="180" rx="20" fill="#ffffff" />
      <line x1="20" y1="150" x2="240" y2="150" stroke="#166534" stroke-width="3.5" stroke-linecap="round" />
      <line x1="40" y1="18" x2="40" y2="162" stroke="#166534" stroke-width="3.5" stroke-linecap="round" />
      <line x1="30" y1="128" x2="210" y2="42" stroke="#16a34a" stroke-width="4" stroke-linecap="round" />
      <line x1="30" y1="52" x2="214" y2="138" stroke="#0f766e" stroke-width="4" stroke-linecap="round" />
      <circle cx="126" cy="84" r="7.5" fill="#14532d" />
      <text x="138" y="80" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="700" fill="#14532d">
        (x, y)
      </text>
      <text x="182" y="38" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="700" fill="#16a34a">
        Recta 1
      </text>
      <text x="178" y="152" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f766e">
        Recta 2
      </text>
    </g>
  </g>

  <g>
    <path d="M388 208 C426 208, 436 208, 470 208" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round" />
    <path d="M454 190 L490 208 L454 226" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <g filter="url(#shadow)">
    <rect x="494" y="60" width="266" height="300" rx="28" fill="url(#panel)" />
    <rect x="494" y="60" width="266" height="16" rx="8" fill="url(#accent)" />
    <text x="520" y="102" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">
      Tipos de sistema
    </text>

    <g transform="translate(520 132)">
      <rect x="0" y="0" width="210" height="72" rx="18" fill="#ffffff" />
      <line x1="20" y1="54" x2="188" y2="14" stroke="#16a34a" stroke-width="4" stroke-linecap="round" />
      <line x1="20" y1="18" x2="188" y2="58" stroke="#0f766e" stroke-width="4" stroke-linecap="round" />
      <text x="18" y="90" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="700" fill="#166534">
        SCD: una solucion
      </text>
    </g>

    <g transform="translate(520 224)">
      <rect x="0" y="0" width="210" height="44" rx="18" fill="#ffffff" />
      <line x1="18" y1="30" x2="190" y2="10" stroke="#16a34a" stroke-width="4" stroke-linecap="round" />
      <line x1="18" y1="36" x2="190" y2="16" stroke="#0f766e" stroke-width="4" stroke-linecap="round" />
      <text x="18" y="64" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="700" fill="#166534">
        SI: sin solucion
      </text>
    </g>

    <g transform="translate(520 286)">
      <rect x="0" y="0" width="210" height="44" rx="18" fill="#ffffff" />
      <line x1="18" y1="22" x2="190" y2="22" stroke="#16a34a" stroke-width="4" stroke-linecap="round" />
      <line x1="18" y1="22" x2="190" y2="22" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 5" />
      <text x="18" y="64" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="700" fill="#166534">
        SCI: infinitas soluciones
      </text>
    </g>
  </g>

  <g transform="translate(156 18)">
    <rect width="488" height="40" rx="18" fill="#ffffff" opacity="0.94" />
    <text x="244" y="25" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="700" fill="#166534">
      Metodo del caso: definir variables, formular ecuaciones, resolver e interpretar
    </text>
  </g>
</svg>
