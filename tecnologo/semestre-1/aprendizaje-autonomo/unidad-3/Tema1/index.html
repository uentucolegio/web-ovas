<!DOCTYPE html>
<html lang="es">

<head>

  <title>OVA - Aprendizaje Autónomo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">

<body class="bg-gray-100 flex">

    <aside class="w-64 bg-white shadow-lg flex-shrink-0 hidden md:flex md:flex-col">

        <img src="img/logoCINTIA.png" alt="Logo OVA" class="w-5/6 h-5/6 object-contain" loading="lazy">
      </div>
      <nav class="mt-6 flex-1">
        <a href="#" class="sidebar-link active flex items-center py-3 px-6 font-medium text-slate-700"
          data-page="inicio.html">
          <span class="mr-3 text-xl">🚀</span> Introducción</a>
        <a href="#" class="sidebar-link flex items-center py-3 px-6 font-medium text-slate-700"
          data-page="objetivos.html">
          <span class="mr-3 text-xl">🎯</span> Objetivos</a>
        <a href="#" class="sidebar-link flex items-center py-3 px-6 font-medium text-slate-700"
          data-page="Contenido.html">
          <span class="mr-3 text-xl">📚</span> Contenido</a>
        <a href="#" class="sidebar-link flex items-center py-3 px-6 font-medium text-slate-700"
          data-page="actividades.html">

        <a href="#" class="sidebar-link flex items-center py-3 px-6 font-medium text-slate-700" data-page="eva.html">

        <a href="#" class="sidebar-link flex items-center py-3 px-6 font-medium text-slate-700"
          data-page="Lecturas.html">

        <a href="#" class="sidebar-link flex items-center py-3 px-6 font-medium text-slate-700" data-page="biblio.html">
          <span class="mr-3 text-xl">📚</span> Bibliografía</a>
      </nav>
    </aside>

    <!-- Contenido dinámico -->
    <main id="content-area" class="flex-1 p-6" style="display:block;">
      <p class="text-gray-500">Cargando contenido...</p>
    </main>

    <main id="contenido" class="flex-1 p-6" style="display:none;">
      <!-- Iframe Genially -->
      <section>

        <div style="max-width: 1900px; margin: auto;">
          <iframe src="https://view.genially.com/69cfe139ce7f2c4ce37b2137" frameborder="0" allowfullscreen
            scrolling="yes" width="1900" height="600" allowscriptaccess="always" allowfullscreen="true" scrolling="yes"
            allownetworking="all" style="width:100%; aspect-ratio:16/9; border:0;">
          </iframe>
        </div>
        <!-- Footer/Credits -->
        <footer class="mt-12 pt-6 border-t-2 border-slate-200 text-center w-full">
            <p class="text-slate-600 font-medium mb-2">Creado por:</p>
            <p class="text-green-800 font-bold text-lg mb-2">Centro de Innovación en TIC para el apoyo de la Docencia CINTIA</p>
            <p class="text-slate-500 text-sm mb-0">Universidad de Córdoba</p>
        </footer>
      </section>
    </main>





    <!-- Scripts -->
    <script src="nav.js"></script>
    <script src="quiz.js"></script>
