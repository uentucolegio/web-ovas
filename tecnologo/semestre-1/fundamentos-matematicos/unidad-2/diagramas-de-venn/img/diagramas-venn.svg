<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Diagramas de Venn y estudio de casos</title>
  <desc id="desc">Ilustración con universo, dos conjuntos, regiones sombreadas y lectura de operaciones.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="800" height="420" rx="32" fill="url(#bg)" />
  <circle cx="120" cy="92" r="72" fill="#bbf7d0" opacity="0.38" />
  <circle cx="696" cy="322" r="90" fill="#dcfce7" opacity="0.5" />

  <g filter="url(#shadow)">
    <rect x="42" y="52" width="420" height="316" rx="28" fill="url(#panel)" />
    <rect x="42" y="52" width="420" height="16" rx="8" fill="url(#accent)" />
    <text x="68" y="96" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">
      Universo U
    </text>

    <rect x="84" y="120" width="336" height="204" rx="26" fill="#ffffff" stroke="#86efac" stroke-width="3" />

    <circle cx="214" cy="224" r="82" fill="#86efac" opacity="0.55" />
    <circle cx="300" cy="224" r="82" fill="#4ade80" opacity="0.4" />
    <ellipse cx="257" cy="224" rx="39" ry="82" fill="#22c55e" opacity="0.28" />

    <text x="176" y="156" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="700" fill="#166534">A</text>
    <text x="328" y="156" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="700" fill="#166534">B</text>

    <text x="171" y="228" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="700" fill="#166534">A - B</text>
    <text x="257" y="228" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="700" fill="#166534">A ∩ B</text>
    <text x="343" y="228" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="700" fill="#166534">B - A</text>
    <text x="252" y="300" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="700" fill="#64748b">Exterior = U - (A ∪ B)</text>
  </g>

  <g>
    <path d="M486 210 C528 210, 534 210, 572 210" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round" />
    <path d="M556 192 L592 210 L556 228" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <g filter="url(#shadow)">
    <rect x="596" y="88" width="164" height="242" rx="28" fill="url(#panel)" />
    <rect x="596" y="88" width="164" height="16" rx="8" fill="url(#accent)" />
    <text x="618" y="128" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">
      Lecturas
    </text>

    <g transform="translate(618 150)">
      <rect width="118" height="34" rx="12" fill="#ffffff" />
      <text x="14" y="22" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="700" fill="#166534">A ∪ B</text>
      <text x="55" y="22" font-family="Poppins, Arial, sans-serif" font-size="13" fill="#475569">ambos conjuntos</text>
    </g>

    <g transform="translate(618 194)">
      <rect width="118" height="34" rx="12" fill="#ffffff" />
      <text x="14" y="22" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="700" fill="#166534">A ∩ B</text>
      <text x="55" y="22" font-family="Poppins, Arial, sans-serif" font-size="13" fill="#475569">solo cruce</text>
    </g>

    <g transform="translate(618 238)">
      <rect width="118" height="34" rx="12" fill="#ffffff" />
      <text x="14" y="22" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="700" fill="#166534">A - B</text>
      <text x="55" y="22" font-family="Poppins, Arial, sans-serif" font-size="13" fill="#475569">parte exclusiva</text>
    </g>

    <g transform="translate(618 282)">
      <rect width="118" height="34" rx="12" fill="#ffffff" />
      <text x="14" y="22" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="700" fill="#166534">Aᶜ</text>
      <text x="42" y="22" font-family="Poppins, Arial, sans-serif" font-size="13" fill="#475569">fuera de A en U</text>
    </g>
  </g>

  <g transform="translate(184 20)">
    <rect width="430" height="40" rx="18" fill="#ffffff" opacity="0.94" />
    <text x="215" y="25" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="700" fill="#166534">
      Metodo del caso: definir U, ubicar A y B, sombrear e interpretar
    </text>
  </g>
</svg>
