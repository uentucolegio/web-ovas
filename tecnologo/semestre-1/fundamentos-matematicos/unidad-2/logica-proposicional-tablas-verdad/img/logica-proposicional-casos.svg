<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Logica proposicional y estudio de casos</title>
  <desc id="desc">Diagrama con un caso, una expresion simbolica y una tabla de verdad.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfeff" />
      <stop offset="100%" stop-color="#fffaf0" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="800" height="420" rx="32" fill="url(#bg)" />
  <circle cx="115" cy="88" r="72" fill="#99f6e4" opacity="0.35" />
  <circle cx="702" cy="330" r="84" fill="#fde68a" opacity="0.28" />

  <g filter="url(#shadow)">
    <rect x="40" y="74" width="228" height="184" rx="26" fill="url(#card)" />
    <rect x="40" y="74" width="228" height="16" rx="8" fill="url(#accent)" />
    <text x="64" y="118" font-family="Space Grotesk, Arial, sans-serif" font-size="18" font-weight="700" fill="#134e4a">
      Caso
    </text>
    <text x="64" y="151" font-family="Source Sans 3, Arial, sans-serif" font-size="17" fill="#334155">
      Cambiar fase si hay
    </text>
    <text x="64" y="176" font-family="Source Sans 3, Arial, sans-serif" font-size="17" fill="#334155">
      vehiculo o peaton.
    </text>
    <rect x="64" y="202" width="74" height="38" rx="12" fill="#ecfeff" />
    <rect x="152" y="202" width="74" height="38" rx="12" fill="#ecfeff" />
    <text x="101" y="226" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f766e">
      p
    </text>
    <text x="189" y="226" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f766e">
      q
    </text>
  </g>

  <g>
    <path d="M286 168 C336 168, 336 168, 382 168" fill="none" stroke="#0f766e" stroke-width="8" stroke-linecap="round" />
    <path d="M366 150 L404 168 L366 186" fill="none" stroke="#0f766e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <g filter="url(#shadow)">
    <rect x="406" y="122" width="126" height="92" rx="24" fill="url(#card)" />
    <rect x="406" y="122" width="126" height="14" rx="7" fill="#f59e0b" />
    <text x="469" y="160" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-size="18" font-weight="700" fill="#92400e">
