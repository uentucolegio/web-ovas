      <text x="26" y="23" font-family="Space Grotesk, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f766e">p</text>
      <text x="72" y="23" font-family="Space Grotesk, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f766e">q</text>
      <text x="116" y="23" font-family="Space Grotesk, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f766e">p ∨ q</text>

