    </text>
    <text x="469" y="193" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">
      p ∨ q
    </text>
  </g>

  <g>
    <path d="M550 168 C596 168, 596 168, 636 168" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />
    <path d="M620 150 L658 168 L620 186" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
