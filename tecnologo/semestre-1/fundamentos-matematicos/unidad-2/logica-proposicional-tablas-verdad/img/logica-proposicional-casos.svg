        <text x="22" y="22" font-family="Source Sans 3, Arial, sans-serif" font-size="16" font-weight="700" fill="#166534">V</text>
        <text x="68" y="22" font-family="Source Sans 3, Arial, sans-serif" font-size="16" font-weight="700" fill="#166534">V</text>
        <text x="122" y="22" font-family="Source Sans 3, Arial, sans-serif" font-size="16" font-weight="700" fill="#166534">V</text>
      </g>

      <g transform="translate(0 84)">
        <rect width="150" height="34" rx="10" fill="#ffffff" />
        <text x="22" y="22" font-family="Source Sans 3, Arial, sans-serif" font-size="16" font-weight="700" fill="#166534">V</text>
        <text x="68" y="22" font-family="Source Sans 3, Arial, sans-serif" font-size="16" font-weight="700" fill="#991b1b">F</text>
        <text x="122" y="22" font-family="Source Sans 3, Arial, sans-serif" font-size="16" font-weight="700" fill="#166534">V</text>
      </g>

      <g transform="translate(0 124)">
        <rect width="150" height="34" rx="10" fill="#ffffff" />
        <text x="22" y="22" font-family="Source Sans 3, Arial, sans-serif" font-size="16" font-weight="700" fill="#991b1b">F</text>
        <text x="68" y="22" font-family="Source Sans 3, Arial, sans-serif" font-size="16" font-weight="700" fill="#166534">V</text>
        <text x="122" y="22" font-family="Source Sans 3, Arial, sans-serif" font-size="16" font-weight="700" fill="#166534">V</text>
      </g>

      <g transform="translate(0 164)">
        <rect width="150" height="34" rx="10" fill="#ffffff" />
        <text x="22" y="22" font-family="Source Sans 3, Arial, sans-serif" font-size="16" font-weight="700" fill="#991b1b">F</text>
        <text x="68" y="22" font-family="Source Sans 3, Arial, sans-serif" font-size="16" font-weight="700" fill="#991b1b">F</text>
        <text x="122" y="22" font-family="Source Sans 3, Arial, sans-serif" font-size="16" font-weight="700" fill="#991b1b">F</text>
      </g>
    </g>
  </g>

  <g transform="translate(58 302)">
    <rect width="432" height="70" rx="22" fill="#ffffff" opacity="0.9" />
    <text x="26" y="28" font-family="Space Grotesk, Arial, sans-serif" font-size="16" font-weight="700" fill="#134e4a">
      Metodo del caso
    </text>
    <text x="26" y="51" font-family="Source Sans 3, Arial, sans-serif" font-size="16" fill="#334155">
      Observar, definir proposiciones, simbolizar, construir la tabla e interpretar.
    </text>
