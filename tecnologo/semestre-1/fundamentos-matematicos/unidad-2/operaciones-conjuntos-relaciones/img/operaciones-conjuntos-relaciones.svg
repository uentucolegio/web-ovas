<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Operaciones con conjuntos y relaciones</title>
  <desc id="desc">Diagrama con union e interseccion de conjuntos y una relacion entre elementos.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="800" height="420" rx="32" fill="url(#bg)" />
  <circle cx="118" cy="86" r="72" fill="#bbf7d0" opacity="0.4" />
  <circle cx="700" cy="330" r="90" fill="#dcfce7" opacity="0.5" />

  <g filter="url(#shadow)">
    <rect x="38" y="66" width="280" height="292" rx="28" fill="url(#panel)" />
    <rect x="38" y="66" width="280" height="16" rx="8" fill="url(#accent)" />
    <text x="64" y="108" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#14532d">
      Conjuntos
    </text>

    <circle cx="138" cy="202" r="76" fill="#86efac" opacity="0.62" />
    <circle cx="208" cy="202" r="76" fill="#4ade80" opacity="0.48" />

    <text x="106" y="146" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">A</text>
    <text x="234" y="146" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">B</text>

    <text x="102" y="202" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="600" fill="#14532d">1</text>
    <text x="106" y="230" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="600" fill="#14532d">2</text>
    <text x="171" y="188" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="700" fill="#14532d">3</text>
    <text x="171" y="216" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="700" fill="#14532d">4</text>
    <text x="246" y="202" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="600" fill="#14532d">5</text>

    <g transform="translate(62 292)">
      <rect width="232" height="42" rx="14" fill="#ffffff" />
      <text x="18" y="18" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="700" fill="#166534">
        A union B = {1, 2, 3, 4, 5}
      </text>
      <text x="18" y="33" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="700" fill="#166534">
        A inter B = {3, 4}
      </text>
    </g>
  </g>

  <g>
    <path d="M338 206 C382 206, 388 206, 432 206" fill="none" stroke="#16a34a" stroke-width="8" stroke-linecap="round" />
    <path d="M414 188 L452 206 L414 224" fill="none" stroke="#16a34a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <g filter="url(#shadow)">
    <rect x="458" y="64" width="304" height="292" rx="28" fill="url(#panel)" />
    <rect x="458" y="64" width="304" height="16" rx="8" fill="url(#accent)" />
    <text x="484" y="106" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#14532d">
      Relaciones
    </text>

    <g transform="translate(488 140)">
      <rect width="82" height="142" rx="22" fill="#f0fdf4" />
      <rect x="148" width="118" height="142" rx="22" fill="#f0fdf4" />

      <text x="41" y="28" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="700" fill="#166534">
        A
      </text>
      <text x="207" y="28" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="700" fill="#166534">
        B
      </text>

      <g font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="600" fill="#334155">
        <text x="24" y="60">Ana</text>
        <text x="24" y="92">Luis</text>
        <text x="24" y="124">Marta</text>
        <text x="170" y="60">Repo UI</text>
        <text x="170" y="92">Repo API</text>
        <text x="170" y="124">Repo Docs</text>
      </g>

      <g fill="none" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round">
        <path d="M82 56 C110 56, 120 56, 148 56" />
        <path d="M82 56 C116 56, 120 120, 148 120" />
        <path d="M82 88 C112 88, 122 88, 148 88" />
        <path d="M82 120 C116 120, 122 120, 148 120" />
      </g>
    </g>

    <g transform="translate(488 300)">
      <rect width="244" height="34" rx="12" fill="#ffffff" />
      <text x="16" y="22" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="700" fill="#166534">
        R = {(Ana, Repo UI), (Luis, Repo API), ...}
      </text>
    </g>
  </g>

  <g transform="translate(228 22)">
    <rect width="346" height="42" rx="18" fill="#ffffff" opacity="0.94" />
    <text x="173" y="26" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="700" fill="#166534">
      Metodo del caso: identificar conjuntos, operar e interpretar vinculos
    </text>
  </g>
</svg>
