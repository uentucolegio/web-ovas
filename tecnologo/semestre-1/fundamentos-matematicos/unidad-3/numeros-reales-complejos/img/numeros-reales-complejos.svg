<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Propiedades de los numeros reales y complejos</title>
  <desc id="desc">Ilustracion con recta real, plano complejo y ejemplos de propiedades numericas.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="800" height="420" rx="32" fill="url(#bg)" />
  <circle cx="116" cy="88" r="72" fill="#bbf7d0" opacity="0.38" />
  <circle cx="700" cy="322" r="88" fill="#dcfce7" opacity="0.5" />

  <g filter="url(#shadow)">
    <rect x="38" y="64" width="320" height="284" rx="28" fill="url(#panel)" />
    <rect x="38" y="64" width="320" height="16" rx="8" fill="url(#accent)" />
    <text x="64" y="106" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">
      Recta real
    </text>

    <line x1="82" y1="214" x2="314" y2="214" stroke="#166534" stroke-width="6" stroke-linecap="round" />
    <line x1="98" y1="200" x2="98" y2="228" stroke="#166534" stroke-width="4" />
    <line x1="168" y1="200" x2="168" y2="228" stroke="#166534" stroke-width="4" />
    <line x1="238" y1="200" x2="238" y2="228" stroke="#166534" stroke-width="4" />
    <line x1="298" y1="200" x2="298" y2="228" stroke="#166534" stroke-width="4" />

    <text x="92" y="188" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="700" fill="#166534">-2</text>
    <text x="160" y="188" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="700" fill="#166534">0</text>
    <text x="230" y="188" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="700" fill="#166534">π</text>
    <text x="286" y="188" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="700" fill="#166534">√2</text>

    <g transform="translate(68 260)">
      <rect width="258" height="58" rx="16" fill="#ffffff" />
      <text x="16" y="24" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="700" fill="#166534">
        Distributiva
      </text>
      <text x="16" y="45" font-family="Poppins, Arial, sans-serif" font-size="13" fill="#475569">
        6(12 + 3) = 6·12 + 6·3
      </text>
    </g>
  </g>

  <g>
    <path d="M376 208 C420 208, 426 208, 466 208" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round" />
    <path d="M450 190 L486 208 L450 226" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <g filter="url(#shadow)">
    <rect x="492" y="64" width="268" height="284" rx="28" fill="url(#panel)" />
    <rect x="492" y="64" width="268" height="16" rx="8" fill="url(#accent)" />
    <text x="518" y="106" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">
      Plano complejo
    </text>

    <line x1="626" y1="132" x2="626" y2="296" stroke="#166534" stroke-width="4" stroke-linecap="round" />
    <line x1="540" y1="214" x2="712" y2="214" stroke="#166534" stroke-width="4" stroke-linecap="round" />

    <circle cx="674" cy="148" r="8" fill="#22c55e" />
    <text x="684" y="146" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="700" fill="#166534">3 + 4i</text>

    <circle cx="674" cy="280" r="8" fill="#86efac" />
    <text x="684" y="298" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="700" fill="#166534">3 - 4i</text>

    <line x1="626" y1="214" x2="674" y2="148" stroke="#16a34a" stroke-width="4" stroke-dasharray="8 6" />
    <text x="578" y="170" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="700" fill="#166534">|z| = 5</text>

    <g transform="translate(530 310)">
      <rect width="206" height="24" rx="10" fill="#ffffff" />
      <text x="12" y="17" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="700" fill="#166534">
        z̄ = 3 + 4i,  i² = -1
      </text>
    </g>
  </g>

  <g transform="translate(182 20)">
    <rect width="436" height="40" rx="18" fill="#ffffff" opacity="0.94" />
    <text x="218" y="25" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="700" fill="#166534">
      Metodo del caso: identificar el numero, operar y justificar
    </text>
  </g>
</svg>
