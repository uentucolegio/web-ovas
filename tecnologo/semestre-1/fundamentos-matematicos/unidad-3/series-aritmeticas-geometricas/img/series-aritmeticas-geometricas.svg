<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Series aritmeticas y geometricas</title>
  <desc id="desc">Ilustracion con patron lineal, patron geometrico y formulas de suma.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="800" height="420" rx="32" fill="url(#bg)" />
  <circle cx="116" cy="90" r="72" fill="#bbf7d0" opacity="0.38" />
  <circle cx="702" cy="328" r="88" fill="#dcfce7" opacity="0.5" />

  <g filter="url(#shadow)">
    <rect x="38" y="64" width="326" height="288" rx="28" fill="url(#panel)" />
    <rect x="38" y="64" width="326" height="16" rx="8" fill="url(#accent)" />
    <text x="64" y="106" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">
      Serie aritmetica
    </text>

    <g transform="translate(74 138)">
      <rect x="0" y="116" width="32" height="44" rx="8" fill="#22c55e" opacity="0.5" />
      <rect x="54" y="92" width="32" height="68" rx="8" fill="#22c55e" opacity="0.58" />
      <rect x="108" y="68" width="32" height="92" rx="8" fill="#22c55e" opacity="0.66" />
      <rect x="162" y="44" width="32" height="116" rx="8" fill="#22c55e" opacity="0.74" />
      <rect x="216" y="20" width="32" height="140" rx="8" fill="#22c55e" opacity="0.82" />

      <text x="14" y="180" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="700" fill="#166534">12</text>
      <text x="68" y="180" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="700" fill="#166534">15</text>
      <text x="122" y="180" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="700" fill="#166534">18</text>
      <text x="176" y="180" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="700" fill="#166534">21</text>
      <text x="230" y="180" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="700" fill="#166534">24</text>
    </g>

    <g transform="translate(66 320)">
      <rect width="270" height="22" rx="10" fill="#ffffff" />
      <text x="14" y="15" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="700" fill="#166534">
        a_n = a_1 + (n - 1)d,   S_n = n(a_1 + a_n)/2
      </text>
    </g>
  </g>

  <g>
    <path d="M382 210 C426 210, 432 210, 472 210" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round" />
    <path d="M456 192 L492 210 L456 228" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <g filter="url(#shadow)">
    <rect x="498" y="64" width="264" height="288" rx="28" fill="url(#panel)" />
    <rect x="498" y="64" width="264" height="16" rx="8" fill="url(#accent)" />
    <text x="522" y="106" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">
      Serie geometrica
    </text>

    <g transform="translate(534 136)">
      <circle cx="24" cy="144" r="12" fill="#16a34a" opacity="0.45" />
      <circle cx="90" cy="138" r="18" fill="#16a34a" opacity="0.54" />
      <circle cx="168" cy="124" r="28" fill="#16a34a" opacity="0.64" />
      <circle cx="74" cy="56" r="10" fill="#16a34a" opacity="0.74" />
      <circle cx="180" cy="54" r="38" fill="#16a34a" opacity="0.28" />

      <text x="24" y="147" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="700" fill="#166534">2</text>
      <text x="90" y="142" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="700" fill="#166534">4</text>
      <text x="168" y="129" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="700" fill="#166534">8</text>
      <text x="74" y="60" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="700" fill="#166534">16</text>
      <text x="180" y="58" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="700" fill="#166534">32</text>
    </g>

    <g transform="translate(520 320)">
      <rect width="220" height="22" rx="10" fill="#ffffff" />
      <text x="12" y="15" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="700" fill="#166534">
        aₙ = a₁ r⁽ⁿ ⁻ ¹⁾,   Sₙ = a₁(1 - rⁿ)/(1 - r)
      </text>
    </g>
  </g>

  <g transform="translate(172 20)">
    <rect width="456" height="40" rx="18" fill="#ffffff" opacity="0.94" />
    <text x="228" y="25" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="700" fill="#166534">
      Metodo del caso: detectar el patron, calcular terminos y sumar la serie
    </text>
  </g>
</svg>
