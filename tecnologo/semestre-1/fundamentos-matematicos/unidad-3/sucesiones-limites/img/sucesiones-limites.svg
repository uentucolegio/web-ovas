<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Sucesiones y limites</title>
  <desc id="desc">Ilustracion con una sucesion creciente, una sucesion convergente y una lectura de limite.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="800" height="420" rx="32" fill="url(#bg)" />
  <circle cx="120" cy="92" r="72" fill="#bbf7d0" opacity="0.38" />
  <circle cx="700" cy="328" r="88" fill="#dcfce7" opacity="0.5" />

  <g filter="url(#shadow)">
    <rect x="40" y="60" width="320" height="296" rx="28" fill="url(#panel)" />
    <rect x="40" y="60" width="320" height="16" rx="8" fill="url(#accent)" />
    <text x="64" y="102" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">
      Sucesiones
    </text>

    <g transform="translate(72 144)">
      <line x1="0" y1="150" x2="250" y2="150" stroke="#166534" stroke-width="4" stroke-linecap="round" />
      <circle cx="18" cy="126" r="8" fill="#16a34a" />
      <circle cx="58" cy="110" r="8" fill="#16a34a" />
      <circle cx="98" cy="94" r="8" fill="#16a34a" />
      <circle cx="138" cy="78" r="8" fill="#16a34a" />
      <circle cx="178" cy="62" r="8" fill="#16a34a" />
      <text x="8" y="176" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="700" fill="#166534">a₁</text>
      <text x="48" y="176" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="700" fill="#166534">a₂</text>
      <text x="88" y="176" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="700" fill="#166534">a₃</text>
      <text x="128" y="176" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="700" fill="#166534">a₄</text>
      <text x="168" y="176" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="700" fill="#166534">a₅</text>
    </g>

    <g transform="translate(68 300)">
      <rect width="260" height="30" rx="12" fill="#ffffff" />
      <text x="16" y="20" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="700" fill="#166534">
        aₙ = a₁ + (n - 1)d  /  aₙ = a₁ r⁽ⁿ ⁻ ¹⁾
      </text>
    </g>
  </g>

  <g>
    <path d="M378 208 C420 208, 426 208, 466 208" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round" />
    <path d="M450 190 L486 208 L450 226" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <g filter="url(#shadow)">
    <rect x="492" y="60" width="268" height="296" rx="28" fill="url(#panel)" />
    <rect x="492" y="60" width="268" height="16" rx="8" fill="url(#accent)" />
    <text x="518" y="102" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">
      Limites
    </text>

    <g transform="translate(520 132)">
      <line x1="0" y1="150" x2="208" y2="150" stroke="#166534" stroke-width="3.5" stroke-linecap="round" />
      <line x1="0" y1="60" x2="208" y2="60" stroke="#22c55e" stroke-width="3.5" stroke-dasharray="8 6" />
      <circle cx="24" cy="28" r="7" fill="#16a34a" />
      <circle cx="56" cy="40" r="7" fill="#16a34a" />
      <circle cx="92" cy="48" r="7" fill="#16a34a" />
      <circle cx="132" cy="53" r="7" fill="#16a34a" />
      <circle cx="176" cy="57" r="7" fill="#16a34a" />
      <text x="142" y="52" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="700" fill="#166534">L</text>

      <text x="10" y="172" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="700" fill="#166534">n</text>
      <text x="178" y="172" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="700" fill="#166534">∞</text>
    </g>

    <g transform="translate(520 300)">
      <rect width="212" height="30" rx="12" fill="#ffffff" />
      <text x="14" y="20" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="700" fill="#166534">
        lim a_n = L  /  lim a_n = +∞
      </text>
    </g>
  </g>

  <g transform="translate(182 20)">
    <rect width="436" height="40" rx="18" fill="#ffffff" opacity="0.94" />
    <text x="218" y="25" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="700" fill="#166534">
      Metodo del caso: detectar el patron, generar terminos y leer el limite
    </text>
  </g>
</svg>
